[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "langmarl"
version = "0.2.0"
description = "Language-space Multi-Agent Reinforcement Learning"
authors = [{name = "LangMARL Authors"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "tqdm",
]

[project.optional-dependencies]
pettingzoo = ["pettingzoo[butterfly]", "supersuit", "imageio"]
all = ["pettingzoo[butterfly]", "supersuit", "imageio"]
dev = ["pytest", "sphinx", "sphinx-rtd-theme"]

[project.scripts]
langmarl-train = "langmarl.cli.train:main"
