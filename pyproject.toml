[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "langmarl"
version = "1.0.0"
description = "Language-space Multi-Agent Reinforcement Learning"
authors = [{name = "LangMARL Authors"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/DaRL-GenAI/LangMARL"
Repository = "https://github.com/DaRL-GenAI/LangMARL"
Documentation = "https://langmarl.readthedocs.io/"
Paper = "https://arxiv.org/abs/2604.00722"
"Bug Tracker" = "https://github.com/DaRL-GenAI/LangMARL/issues"

[project.optional-dependencies]
pettingzoo = ["pettingzoo[butterfly]", "supersuit", "imageio"]
all = ["pettingzoo[butterfly]", "supersuit", "imageio"]
dev = ["pytest", "sphinx", "sphinx-rtd-theme"]

[project.scripts]
langmarl-train = "langmarl.cli.train:main"
